name: gympro
description: A complete Firebase-powered gym tracking app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  google_sign_in: ^6.3.0
  provider: ^6.1.5
  fl_chart: ^0.69.2
  in_app_purchase: ^3.2.1
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  uuid: ^4.5.1
  intl: ^0.19.0
  flutter_svg: ^2.2.0
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
